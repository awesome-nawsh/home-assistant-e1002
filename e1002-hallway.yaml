# =============================================================================
# reTerminal E1002 — Hallway e-paper panel (battery, deep sleep)
# Flow: boot → Wi-Fi → GET <scheduler>/api/image (server picks the scheduled screen)
#       → draw → POST battery report → GET /api/sleep → deep sleep that many seconds
# Target: ESPHome 2026.9.x  |  Pins hardware-verified 2026-10-17
# =============================================================================
substitutions:
  name: e1002-hallway
  friendly_name: "E1002 Hallway"
  device_id: e1002
  # E1002 Scheduler add-on (port 8098). Use HA's LAN IP if mDNS is unreliable from the ESP.
  scheduler_url: "http://homeassistant.local:8098"
  fallback_sleep: "10"      # minutes, used only if the scheduler can't be reached
  refresh_settle: 40s       # Spectra-6 full refresh time before sleeping

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - output.turn_on: battery_enable
        - lambda: |-
            // Which button woke us? (ext1 bitmask; 0 = timer / power-on)
            uint64_t mask = esp_sleep_get_ext1_wakeup_status();
            if (mask & (1ULL << 4))      id(nav) = "next";     // right white
            else if (mask & (1ULL << 5)) id(nav) = "prev";     // left white
            else if (mask & (1ULL << 3)) id(nav) = "refresh";  // green: same screen again
            else                         id(nav) = "";         // timer: rotate
            ESP_LOGI("wake", "wakeup mask=0x%llx nav='%s'", mask, id(nav).c_str());
    - priority: -100   # after Wi-Fi/API are up
      then:
        - script.execute: wake_cycle

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal     # E1002 needs octal; quad fails to load the image
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0   # CH340K bridge — needed to see serial logs

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "${name} Fallback"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome      # authenticated by the API encryption key; no separate password

http_request:
  id: http
  verify_ssl: false
  timeout: 20s

globals:
  - id: sleep_seconds
    type: int
    initial_value: "${fallback_sleep} * 60"
  - id: nav
    type: std::string
    initial_value: '""'

# --- Display ------------------------------------------------------------------
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper
    model: Seeed-reTerminal-E1002
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO12
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard));

image:
  - platform: online_image
    id: dashboard
    url: "${scheduler_url}/api/image?device=${device_id}"
    format: PNG
    type: RGB565
    resize: 800x480
    update_interval: never
    on_download_finished:
      then:
        - logger.log: "Image downloaded, drawing"
        - component.update: epaper
        - delay: ${refresh_settle}
        - script.execute: finish_and_sleep
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Image download failed — keeping last image"
        - script.execute: finish_and_sleep

script:
  - id: wake_cycle
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - delay: 2s
      - script.execute: fetch

  - id: fetch
    mode: restart
    then:
      - online_image.set_url:
          id: dashboard
          url: !lambda |-
            std::string u = "${scheduler_url}/api/image?device=${device_id}";
            if (!id(nav).empty()) u += "&nav=" + id(nav);
            return u;
      - component.update: dashboard

  - id: finish_and_sleep
    mode: single
    then:
      # 1. report battery / signal to the scheduler (best effort)
      - http_request.post:
          url: "${scheduler_url}/api/report?device=${device_id}"
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            char buf[96];
            snprintf(buf, sizeof(buf), "{\"battery_pct\":%d,\"battery_v\":%.2f,\"rssi\":%d}",
                     (int) id(battery_pct).state, id(battery_voltage).state, (int) id(wifi_rssi).state);
            return std::string(buf);
          on_error:
            - logger.log:
                level: WARN
                format: "Battery report failed"
      # 2. ask how long to sleep
      - http_request.get:
          url: "${scheduler_url}/api/sleep?device=${device_id}"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  int s = atoi(body.c_str());
                  if (s >= 60 && s <= 6 * 3600) {
                    id(sleep_seconds) = s;
                    ESP_LOGI("sched", "Scheduler says sleep %d s", s);
                  } else {
                    ESP_LOGW("sched", "Bad sleep value '%s', using fallback", body.c_str());
                  }
          on_error:
            - logger.log:
                level: WARN
                format: "Sleep query failed — using fallback"
      # 3. sleep
      - logger.log:
          format: "Entering deep sleep for %d s"
          args: ["id(sleep_seconds)"]
      - deep_sleep.enter:
          id: sleeper
          sleep_duration: !lambda "return (uint32_t) id(sleep_seconds) * 1000;"

# --- Power --------------------------------------------------------------------
deep_sleep:
  id: sleeper
  run_duration: 180s          # safety cap if anything hangs
  esp32_ext1_wakeup:          # any button wakes the device; on_boot reads which one
    pins:
      - {number: GPIO3, allow_other_uses: true}   # green       → refresh current screen
      - {number: GPIO4, allow_other_uses: true}   # right white → next screen
      - {number: GPIO5, allow_other_uses: true}   # left white  → previous screen
    mode: ANY_LOW

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 5s
    filters:
      - multiply: 2.0
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
  - platform: copy
    source_id: battery_voltage
    id: battery_pct
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 4.15 -> 100
          - 3.96 -> 90
          - 3.80 -> 60
          - 3.58 -> 30
          - 3.41 -> 10
          - 3.27 -> 0
      - clamp:
          min_value: 0
          max_value: 100
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 10s

# Buttons while awake (when asleep the same buttons wake the device via ext1 above)
binary_sensor:
  - platform: gpio
    pin: {number: GPIO3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true}
    name: "Green Button"
    on_press:
      - lambda: id(nav) = "refresh";
      - script.execute: fetch
  - platform: gpio
    pin: {number: GPIO4, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true}
    name: "Right Button"
    on_press:
      - lambda: id(nav) = "next";
      - script.execute: fetch
  - platform: gpio
    pin: {number: GPIO5, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true}
    name: "Left Button"
    on_press:
      - lambda: id(nav) = "prev";
      - script.execute: fetch
