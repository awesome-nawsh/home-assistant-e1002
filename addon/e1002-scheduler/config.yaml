name: E1002 Scheduler
version: 0.2.0
slug: e1002_scheduler
description: Screens, schedules and sleep control for a battery e-paper display
url: https://github.com/awesome-nawsh/home-assistant-e1002
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8098
panel_icon: mdi:monitor-dashboard
panel_title: E1002 Screens
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Device API (the ESP32 fetches images and sleep time here)
options:
  puppet_url: "http://0f1cc410-puppet:10000"
  timezone: "Asia/Singapore"
  width: 800
  height: 480
  battery_mah: 2000
  awake_mah_per_wake: 1.5
  draw_mah: 1.0
  sleep_ma: 0.12
schema:
  puppet_url: str
  timezone: str
  width: int
  height: int
  battery_mah: float
  awake_mah_per_wake: float
  draw_mah: float
  sleep_ma: float
